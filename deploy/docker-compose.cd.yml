# 时光选彩 · CI/CD 生产编排（镜像来自 GHCR，不在服务器本地构建）
# 与 docker-compose.prod.yml 的差异：backend/nginx 使用 image，构建在 GitHub Actions 完成。
# 服务器目录需包含：.env（POSTGRES_PASSWORD 等）、nginx.conf、docker-compose.cd.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: shiguang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiguang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiguang}
      POSTGRES_DB: shiguang_lottery
    volumes:
      # CentOS 7 (kernel 3.10) + overlay2 下命名卷会报 Operation not permitted，
      # 改用宿主机目录 bind mount（ext4）持久化数据
      - /opt/shiguang/pgdata:/var/lib/postgresql/data
    security_opt:
      # CentOS 7 老内核下 Docker 默认 seccomp profile 会拦 postgres 写盘（EPERM），
      # 本容器仅在内网且不映射端口，关闭 seccomp 风险可控
      - seccomp:unconfined
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiguang -d shiguang_lottery"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE 未设置}
    container_name: shiguang-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shiguang:${POSTGRES_PASSWORD:-shiguang}@postgres:5432/shiguang_lottery
      DATABASE_URL_SYNC: postgresql+psycopg://shiguang:${POSTGRES_PASSWORD:-shiguang}@postgres:5432/shiguang_lottery
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE 未设置}
    container_name: shiguang-nginx
    restart: unless-stopped
    ports:
      # 仅绑定本机回环，不对外暴露；上层反代转发到此地址
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
