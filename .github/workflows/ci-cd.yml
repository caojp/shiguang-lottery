name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiguang-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 持续集成
  ci:
    name: 构建与冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 后端规则引擎冒烟测试
        working-directory: backend
        run: pytest tests/test_engine_smoke.py -q

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端构建
        working-directory: frontend
        run: npm run build:h5

  # ---------------------------------------------------------------- 构建镜像
  images:
    name: 构建镜像 (${{ matrix.image }})
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: deploy/Dockerfile.backend
          - image: frontend
            dockerfile: deploy/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名（GHCR 要求全小写）
        id: image
        run: |
          base=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "name=${base}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------- 部署
  deploy:
    name: 部署到生产服务器
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像地址
        id: image
        run: |
          base=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: 确保部署目录存在
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            mkdir -p "${{ vars.DEPLOY_PATH || '/opt/shiguang/deploy' }}"

      - name: 上传编排文件（compose + nginx）
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy/docker-compose.cd.yml,deploy/nginx.conf"
          target: ${{ vars.DEPLOY_PATH || '/opt/shiguang/deploy' }}
          strip_components: 1
          overwrite: true

      - name: 拉取镜像并滚动重启
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ steps.image.outputs.base }}-backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ steps.image.outputs.base }}-frontend:${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/shiguang/deploy' }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:8080/api/health' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,DEPLOY_PATH,GHCR_USER,GHCR_PAT,HEALTH_URL
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "缺少 $DEPLOY_PATH/.env，请先在服务器创建生产配置"
              exit 1
            fi

            # 私有 GHCR 包才需要 PAT；公开包可跳过
            if [ -n "${GHCR_PAT:-}" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            export BACKEND_IMAGE FRONTEND_IMAGE
            docker compose -f docker-compose.cd.yml pull backend nginx
            docker compose -f docker-compose.cd.yml up -d --remove-orphans
            # 启动命令已包含迁移，此处兜底（失败不阻断滚动）
            docker compose -f docker-compose.cd.yml exec -T backend alembic upgrade head || true

            echo "等待健康检查…"
            ok=""
            for i in $(seq 1 60); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "健康检查失败，输出后端最近日志："
              docker compose -f docker-compose.cd.yml logs --tail=80 backend
              exit 1
            fi

            curl -fsS "$HEALTH_URL" && echo ""
            docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true
            echo "部署完成：${BACKEND_IMAGE} / ${FRONTEND_IMAGE}"
