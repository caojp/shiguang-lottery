services:
  postgres:
    image: postgres:16-alpine
    container_name: shiguang-postgres
    environment:
      POSTGRES_USER: shiguang
      POSTGRES_PASSWORD: shiguang
      POSTGRES_DB: shiguang_lottery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiguang -d shiguang_lottery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
